services:
  proxy:
    image: quay.io/sentinelc/proxy:${PROXY_TAG}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./volumes/ssl:/ssl
      - ./volumes/api/media:/storage
    env_file:
      - ./configs/proxy.env
    networks:
      - proxy

  vouch:
    image: quay.io/vouch/vouch-proxy:${VOUCH_TAG}
    restart: always
    env_file:
      - ./configs/vouch.env
    networks:
      - proxy

  api_db:
    image: postgres:${POSTGRES_TAG}
    restart: always
    env_file:
      - ./configs/api_db.env
    networks:
      - django
    volumes:
      - ./volumes/api/postgres:/var/lib/postgresql/data
    shm_size: '2gb'

  api_redis:
    image: valkey/valkey:${VALKEY_TAG}
    restart: always
    networks:
      - django

  api:
    image: quay.io/sentinelc/api:${API_TAG}
    restart: always
    depends_on:
      - api_db
      - api_redis
    env_file:
      - ./configs/api.env
    environment:
      # The image binds to loopback by default; the proxy is a separate container here.
      GUNICORN_LISTEN: 0.0.0.0:5000
    networks:
      - proxy
      - django
    volumes:
      - ./volumes/api/media:/storage

  celery:
    image: quay.io/sentinelc/api:${API_TAG}
    restart: always
    depends_on:
      - api_db
      - api_redis
    env_file:
      - ./configs/api.env
    command: /app/scripts/celery-worker.sh
    networks:
      - django
    volumes:
      - ./volumes/api/media:/storage

  beat:
    image: quay.io/sentinelc/api:${API_TAG}
    restart: always
    depends_on:
      - api_db
      - api_redis
    env_file:
      - ./configs/api.env
    command: /app/scripts/celery-beat.sh
    networks:
      - django
    volumes:
      - ./volumes/api/media:/storage

  dex:
    image: quay.io/sentinelc/dex:${DEX_TAG}
    restart: always
    networks:
      - proxy
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./volumes/dex/config:/etc/dex
      - ./volumes/dex/data:/var/dex

  front:
    image: quay.io/sentinelc/front:${FRONT_TAG}
    restart: always
    env_file:
      - ./configs/front.env
    networks:
      - proxy

  vpnrouter:
    image: quay.io/sentinelc/vpnrouter:${VPNROUTER_TAG}
    restart: always
    env_file:
      - ./configs/vpnrouter.env
    environment:
      # The image binds its http proxy to loopback by default; the api container reaches it over the network.
      NGINX_LISTEN_ADDRESS: 0.0.0.0
    networks:
      - django
      - proxy
    cap_add:
     - NET_ADMIN
    ports:
      - "20208:20208/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  portal:
    image: quay.io/sentinelc/portal:${PORTAL_TAG}
    restart: always
    env_file:
      - ./configs/portal.env
    networks:
      - proxy

  logger:
    image: quay.io/sentinelc/logger:${LOGGER_TAG}
    restart: always
    env_file:
      - ./configs/logger.env
    environment:
      # The image binds to loopback by default; the proxy is a separate container here.
      HOST: 0.0.0.0
    networks:
      - proxy
      - logger

  logger_redis:
    image: valkey/valkey:${VALKEY_TAG}
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - logger
    volumes:
      - ./volumes/logger/redis:/data

  docs:
    image: quay.io/sentinelc/docs:${DOCS_TAG}
    restart: always
    env_file:
      - ./configs/docs.env
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.16.0.0/24"
  django:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.16.1.0/24"
  logger:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.16.3.0/24"
